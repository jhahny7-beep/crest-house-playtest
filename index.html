      throw new Error("파일 다운로드 실패 (" + res.status + ")");
    }
    if (!res.body || !res.body.getReader) {
      const buf = await res.arrayBuffer();
      onBytes(buf.byteLength, expectedBytes || buf.byteLength);
      return new Uint8Array(buf);
    }
    const reader = res.body.getReader();
    const chunks = [];
    let received = 0;
    const total = Number(res.headers.get("content-length")) || expectedBytes || 0;
    while (true) {
      const step = await reader.read();
      if (step.done) break;
      chunks.push(step.value);
      received += step.value.byteLength;
      onBytes(received, total || received);
    }
    const joined = new Uint8Array(received);
    let offset = 0;
    for (const c of chunks) {
      joined.set(c, offset);
      offset += c.byteLength;
    }
    return joined;
  }

  if (!window.crypto || !window.crypto.subtle) {
    setError("보안 연결(HTTPS)에서만 암호화를 해제할 수 있어요.");
    enterBtn.disabled = true;
    return;
  }

  const missing = Engine.getMissingFeatures({ threads: false });
  if (missing.length !== 0) {
    setError("이 브라우저에서 WebGL2/WASM 기능을 지원하지 않아요: " + missing.join(", "));
    enterBtn.disabled = true;
    return;
  }

  let busy = false;
  form.addEventListener("submit", async function (ev) {
    ev.preventDefault();
    if (busy) return;
    const pw = pwInput.value.trim();
    if (!pw) {
      setError("비밀번호를 입력해 주세요.");
      return;
    }
    busy = true;
    // Unlock WebAudio and request native fullscreen landscape synchronously inside the trusted submit gesture!
    if (window.__chResumeAudio) window.__chResumeAudio();
    requestNativeLandscape();
    enterBtn.disabled = true;
    pwInput.blur();
    pwInput.disabled = true;
    scheduleLayoutSync();
    setInfo("비밀번호 확인 중...");

    try {
      const salt = b64ToBytes(PLAYTEST_META.salt);
      const key = await deriveKey(pw, salt);

      // 1. Fast cryptographic canary verification (rejects wrong password before downloading game pack)
      try {
        const canaryBuf = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: b64ToBytes(PLAYTEST_META.canaryIv) },
          key,
          b64ToBytes(PLAYTEST_META.canaryCt)
        );
        const canaryStr = new TextDecoder().decode(canaryBuf);
        if (canaryStr !== "CREST_HOUSE_PLAYTEST_OK_V1") {
          throw new Error("canary mismatch");
        }
      } catch (_authErr) {
        setError("비밀번호가 맞지 않아요. 다시 확인해 주세요.");
        busy = false;
        enterBtn.disabled = false;
        pwInput.disabled = false;
        pwInput.select();
        return;
      }

      setInfo("실리아투스 게코 섬을 불러오는 중입니다...");
      setProgress(4, "엔진 및 리소스 다운로드");

      let pckLoaded = 0;
      let wasmLoaded = 0;
      const totalExpected = PLAYTEST_META.encSize + PLAYTEST_META.wasmSize;
      function updateDownloadBar() {
        const ratio = (pckLoaded + wasmLoaded) / Math.max(1, totalExpected);
        setProgress(5 + ratio * 75, "게임 섬 다운로드 중");
      }

      GODOT_CONFIG.onProgress = function (current, total) {
        if (total > 0) {
          wasmLoaded = Math.min(PLAYTEST_META.wasmSize, current);
          updateDownloadBar();
        }
      };
      const engine = new Engine(GODOT_CONFIG);

      // 2. Download encrypted .pck and Godot WASM engine in parallel
      const encPromise = fetchWithProgress(
        "game.pck.enc?v=" + encodeURIComponent(PLAYTEST_META.buildId),
        PLAYTEST_META.encSize,
        function (cur) {
          pckLoaded = cur;
          updateDownloadBar();
        }
      );

      const wasmPromise = engine.init("index");

      const results = await Promise.all([encPromise, wasmPromise]);
      const encBytes = results[0];
      wasmLoaded = PLAYTEST_META.wasmSize;
      setProgress(84, "암호화 해제 중");

      // 3. Parse header [CHPW (4B) | salt (16B) | iv (12B) | ciphertext+tag] & AES-256-GCM decrypt
      if (encBytes.byteLength < 32 ||
          encBytes[0] !== 0x43 || encBytes[1] !== 0x48 || encBytes[2] !== 0x50 || encBytes[3] !== 0x57) {
        throw new Error("손상된 게임 패키지입니다.");
      }
      const pckIv = encBytes.slice(20, 32);
      const pckCt = encBytes.slice(32);
      const decryptedPck = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: pckIv },
        key,
        pckCt
      );

      setProgress(93, "게코 섬 시작 중");
      syncStageLayout();
      await engine.preloadFile(decryptedPck, "index.pck");
      await engine.start({
        args: ["--main-pack", "index.pck"],
        canvas: canvas
      });

      setProgress(100, "입장 완료");
      gameStarted = true;
      canvas.classList.add("ready");
      gate.classList.add("hidden");
      scheduleLayoutSync();
      ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
        canvas.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
      });
      canvas.focus();
    } catch (err) {
      console.error(err);
      setError("실행 중 오류가 발생했어요: " + (err && err.message ? err.message : String(err)));
      busy = false;
      enterBtn.disabled = false;
      pwInput.disabled = false;
    }
  });
})();
</script>
</body>
</html>
